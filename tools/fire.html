<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// Offline renderer for the hero loop and the ember stills.
// Frames are rendered deterministically: window.renderFrame(t) draws time t (seconds).
const P = new URLSearchParams(location.search);
const W = +P.get('w') || 900, H = +P.get('h') || 1125, MODE = +P.get('mode') || 0, LOOP = +P.get('loop') || 8;
const c = document.getElementById('c'); c.width = W; c.height = H;
const gl = c.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
const vs = `attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
const fs = `
precision highp float;
uniform vec2 R; uniform float T; uniform float L; uniform float M;
#define TAU 6.2831853
float h11(float n){return fract(sin(n)*43758.5453123);}
vec2 h22(vec2 p){p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));return fract(sin(p)*43758.5453);}
float h21(vec2 p){return fract(sin(dot(p,vec2(41.3,289.1)))*45758.5453);}
float noise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
  float n=i.x+i.y*157.+113.*i.z;
  return mix(mix(mix(h11(n),h11(n+1.),f.x),mix(h11(n+157.),h11(n+158.),f.x),f.y),
             mix(mix(h11(n+113.),h11(n+114.),f.x),mix(h11(n+270.),h11(n+271.),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*noise(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=.5;}return s;}
// voronoi: returns (distance to nearest, distance to edge, cell id)
vec3 voro(vec2 x){vec2 n=floor(x),f=fract(x);vec2 mg,mr;float md=8.;
  for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 g=vec2(i,j);vec2 o=h22(n+g);vec2 r=g+o-f;float d=dot(r,r);if(d<md){md=d;mr=r;mg=g;}}
  float ed=8.;
  for(int j=-2;j<=2;j++)for(int i=-2;i<=2;i++){vec2 g=mg+vec2(i,j);vec2 o=h22(n+g);vec2 r=g+o-f;
    if(dot(mr-r,mr-r)>.00001)ed=min(ed,dot(.5*(mr+r),normalize(r-mr)));}
  return vec3(sqrt(md),ed,h21(n+mg));}
vec3 fireRamp(float k){k=clamp(k,0.,1.);
  vec3 a=vec3(.06,.01,.02),b=vec3(.55,.06,.03),cc=vec3(1.,.36,.06),d=vec3(1.,.78,.38),e=vec3(1.,.96,.86);
  if(k<.25)return mix(a,b,k/.25); if(k<.5)return mix(b,cc,(k-.25)/.25); if(k<.8)return mix(cc,d,(k-.5)/.3); return mix(d,e,(k-.8)/.2);}

vec3 scene(vec2 uv, float t){
  float horizon = M>.5 ? 1.3 : .47;
  vec3 col = vec3(.03,.01,.018);
  vec2 hz = vec2(fbm(vec3(uv*7.,t*1.4))-.5, fbm(vec3(uv*7.+7.,t*1.4))-.5)*.01*smoothstep(horizon+.5,0.,uv.y);
  uv += hz;
  if(uv.y<horizon){
    float depth = horizon-uv.y;
    vec2 g = vec2(uv.x, 1.) / (depth+.05);
    g *= vec2(1.,.62);
    float dens = M>.5 ? 4.2 : 3.4;
    vec2 gp = g*dens + vec2(fbm(vec3(g*1.2,1.)), fbm(vec3(g*1.2,4.)))*.9;
    vec3 v = voro(gp);
    float heatField = fbm(vec3(g*.35, t*.4));
    float flicker = noise(vec3(gp*.7, t*1.2 + v.z*6.));
    float heat = smoothstep(.36,.72,heatField + (M>.5?.08:0.)) * (.45+.8*flicker);

    float inner = smoothstep(.02,.32,v.y);                    // 0 at the gap, 1 on the lump
    float gap = 1.-smoothstep(.0,.13,v.y);
    float tex = fbm(vec3(gp*5.,v.z*9.));
    float ashy = smoothstep(.35,.75,tex)*(1.-heat*.7)*(.4+.6*v.z);
    vec3 lump = mix(vec3(.03,.022,.024), vec3(.30,.27,.27), ashy) * (.35+.65*inner);
    lump += fireRamp(.35+heat*.5) * (1.-inner) * heat * .9;          // orange under the edges
    lump += fireRamp(.3+heat*.4) * smoothstep(.6,.9,tex) * heat * .5 * (1.-ashy); // live spots
    vec3 g2 = fireRamp(.4+heat*.55) * gap * (.04+pow(heat,1.4)*2.3);
    col = lump*(1.-gap*.8) + g2;
    col *= smoothstep(.0,.05,depth);
    col += fireRamp(.33)*.35*smoothstep(.1,0.,depth);
  }
  // flames: only above the bed
  float fy = uv.y - horizon + .02;
  if(M<.5){
    vec2 q = vec2(uv.x*2.4, fy*1.5);
    float n1 = fbm(vec3(q.x*1.2, q.y*.9 - t*1.7, t*.3));
    float n2 = fbm(vec3(q.x*2.8+3., q.y*2. - t*2.9, t*.45));
    float shape = n1*.85 + n2*.55 - fy*1.45 - .47;
    float flame = smoothstep(.0,.42,shape) * smoothstep(-.03,.04,fy);
    col = col*(1.-flame*.5) + fireRamp(.12+flame*.88) * flame * 1.35;
    col += vec3(1.,.32,.07) * smoothstep(-.35,.15,shape) * .07 * smoothstep(-.1,.05,fy);
  } else {
    float n = fbm(vec3(uv*vec2(2.,1.4) - vec2(0.,t*1.2), t*.3));
    float f = smoothstep(.58,.85,n) * smoothstep(.2,.9,uv.y);
    col = col*(1.-f*.4) + fireRamp(.2+f*.7)*f*.9;
  }
  // grate: thick horizontal iron bars in front of the fire
  if(M<.5){
    for(int i=0;i<5;i++){
      float fi = float(i);
      float y = .40 - fi*.075 - fi*fi*.006;
      float th = .011 + fi*.0035;
      float dy = uv.y - y;
      float bar = smoothstep(th, th*.75, abs(dy));
      float rim = smoothstep(th, .0, abs(dy - th*.55)) * bar;
      vec3 iron = vec3(.028,.016,.019) + fireRamp(.45)*rim*.7*(.5+.6*fbm(vec3(uv.x*6.,fi,t*.5)));
      col = mix(col, iron, bar*.97);
    }
  }
  // sparks
  for(int i=0;i<56;i++){
    float fi=float(i);
    float seed=h11(fi*7.13);
    float speed = floor(1.+seed*3.);
    float ph = fract(t/L*speed + h11(fi*3.7));
    float x0 = (h11(fi*1.91)-.5)*1.2;
    float y = (M>.5?.05:horizon - .05) + ph*1.1;
    float x = x0 + sin(ph*TAU*(1.+seed)+fi)*.05*(1.+ph*2.);
    vec2 d = uv - vec2(x,y);
    d.y *= .4;
    float s = .0028 + .0028*h11(fi*5.3);
    float a = smoothstep(s,0.,length(d)) * smoothstep(1.,.5,ph) * smoothstep(0.,.08,ph);
    col += vec3(1.,.6,.22) * a * 2.4;
  }
  float sm = fbm(vec3(uv*1.6 - vec2(0.,t*.22), t*.1));
  col = mix(col, vec3(.13,.09,.11), smoothstep(.5,.9,sm)*smoothstep(.7,1.15,uv.y)*.5);
  return col;
}
void main(){
  vec2 fc = gl_FragCoord.xy;
  vec2 uv = vec2((fc.x - .5*R.x)/R.y, fc.y/R.y);
  float t = T;
  // seamless loop: crossfade into the state one loop earlier during the last 30%
  float w = smoothstep(.7*L, L, t);
  vec3 col = mix(scene(uv,t), scene(uv,t-L), w);
  // vignette, filmic curve, grain
  vec2 vu = fc/R - .5;
  col *= 1. - dot(vu,vu)*1.1;
  col = col/(1.+col*.35);
  col = pow(col, vec3(.92));
  col += (h21(fc + fract(t)*91.)-.5)*.025;
  gl_FragColor = vec4(col,1.);
}`;
function sh(type, src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const uR=gl.getUniformLocation(pr,'R'),uT=gl.getUniformLocation(pr,'T'),uL=gl.getUniformLocation(pr,'L'),uM=gl.getUniformLocation(pr,'M');
gl.viewport(0,0,W,H);
window.renderFrame = (t) => { gl.uniform2f(uR,W,H); gl.uniform1f(uT,t); gl.uniform1f(uL,LOOP); gl.uniform1f(uM,MODE); gl.drawArrays(gl.TRIANGLES,0,3); gl.finish(); return c.toDataURL('image/png'); };
window.ready = true;
</script></body></html>
